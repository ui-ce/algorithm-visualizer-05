<div
  class="mini-demo"
  #demoCard
  [style.transform]="tiltTransform"
  (pointermove)="onPointerMove($event, demoCard)"
  (pointerleave)="onPointerLeave()"
>
  <div class="mini-demo__head">
    <span class="mini-demo__label text-label-medium">{{ 'landing.hero.demo.label' | translate }}</span>
    @if (isSorted()) {
      <span class="mini-demo__sorted-badge text-label-medium">{{ 'landing.hero.demo.sorted' | translate }}</span>
    }
  </div>

  <div class="mini-demo__stage">
    @for (bar of bars(); track $index) {
      <div class="mini-demo__bar-column">
        <div
          class="mini-demo__bar"
          [class.mini-demo__bar--comparing]="bar.state === 'comparing'"
          [class.mini-demo__bar--swapping]="bar.state === 'swapping'"
          [class.mini-demo__bar--sorted]="bar.state === 'sorted'"
          [style.height.%]="bar.value"
        ></div>
        <span class="mini-demo__bar-value text-label-medium">{{ bar.value }}</span>
      </div>
    }
  </div>

  <div class="mini-demo__controls">
    <algo-play-pause-button [type]="isPlaying() ? 'pause' : 'play'" (click)="togglePlay()" />
    <algo-button
      variant="navigation"
      [text]="'landing.hero.demo.reset' | translate"
      (click)="reset()"
    />
  </div>
</div>
