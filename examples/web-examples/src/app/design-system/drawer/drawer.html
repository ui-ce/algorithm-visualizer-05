<div
  class="algo-drawer"
  [class.algo-drawer--fa]="languageService.currentLanguage() === 'fa'"
  [class.algo-drawer--full-width]="fullWidth"
  [class.algo-drawer--no-close]="hideCloseButton"
  [class.algo-drawer--plain]="plain"
>
  <div class="algo-drawer__icon-column">
    <div class="algo-drawer__icon-group">
      <ng-content select="[icon-buttons]" />
    </div>
    <div class="algo-drawer__icon-group">
      <ng-content select="[icon-buttons-bottom]" />
    </div>
  </div>

  @if (isOpen) {
    <div class="algo-drawer__panel">
      <div class="algo-drawer__panel-header">
        @if (!hideCloseButton) {
        <button
          type="button"
          class="algo-drawer__close-button"
          [attr.aria-label]="'practice.viz.close' | translate"
          (click)="closed.emit()"
        >
          <svg solarArrowLeftLinear [size]="24"></svg>
        </button>
        } @else if (pageIndicator) {
        <span class="algo-drawer__page-indicator text-body-medium">{{ pageIndicator }}</span>
        }

        @if (title) {
          <p class="algo-drawer__panel-title text-body-large-emphasized">{{ title }}</p>
        }
      </div>

      <div class="algo-drawer__panel-content">
        <div class="algo-drawer__panel-content-inner">
          <ng-content select="[panel-content]" />
        </div>
      </div>
    </div>
  }
</div>
