<div class="algo-password-field">
  <label class="algo-password-field__label text-body-medium">{{ label }}</label>

  <div class="algo-password-field__input-wrapper" [class.algo-password-field__input-wrapper--error]="errorMessage">
    <input
      [type]="isVisible ? 'text' : 'password'"
      class="algo-password-field__input text-label-medium-regular"
      [placeholder]="placeholder"
      [value]="value"
      [attr.autocomplete]="autocomplete"
      (input)="onInput($any($event.target).value)"
      (keydown.enter)="enterPressed.emit()"
    />

    <button
      type="button"
      class="algo-password-field__toggle"
      [attr.aria-label]="isVisible ? 'Hide password' : 'Show password'"
      (click)="toggleVisibility()"
    >
      @if (isVisible) {
        <svg solarEyeLinear [size]="18"></svg>
      } @else {
        <svg solarEyeClosedLinear [size]="18"></svg>
      }
    </button>
  </div>

  @if (errorMessage) {
    <p class="algo-password-field__error text-label-medium-regular">{{ errorMessage }}</p>
  }
</div>
