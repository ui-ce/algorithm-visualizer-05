<div class="algo-test-stats">
  @for (box of boxes; track box.key) {
    <div class="algo-test-stats__box">
      <span class="algo-test-stats__label text-body-medium">{{ box.label }}</span>
      <span class="algo-test-stats__value-row">
        <span class="algo-test-stats__value text-title-large" [style.color]="box.colorVar">{{ box.value }}</span>
        @if (box.key === 'xp') {
          <img class="algo-test-stats__trophy" src="/quiz/quiz-xp-trophy.webp" alt="" width="24" height="24" />
        }
      </span>
    </div>
  }
</div>
