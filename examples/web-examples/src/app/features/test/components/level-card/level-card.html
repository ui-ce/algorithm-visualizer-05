<section class="algo-level-card" [class.algo-level-card--locked]="isLocked" [style.--level-accent]="accentColorVar"
  [style.--level-badge]="badgeColorVar">
  <div class="algo-level-card__icon-wrap">
    <img class="algo-level-card__icon-badge" [src]="faceImage" [alt]="label + ' level'" width="80" height="80" />
  </div>

  <h3 class="algo-level-card__title text-title-large-medium">{{ label }}</h3>

  <div class="algo-level-card__star-worth" [attr.title]="'Finishing ' + label + ' brings your total to ' + starWorth + ' star' + (starWorth > 1 ? 's' : '')">
    @for (star of starWorthSlots; track star) {
      <svg solarStarBold [size]="12"></svg>
    }
  </div>

  <p class="algo-level-card__subtitle text-body-medium">{{ data.sets.length }} Sets - {{ questionsPerSet }} Questions
    per Set</p>

  @if (isLocked) {
  <div class="algo-level-card__locked-panel">
    <span class="algo-level-card__locked-icon-wrap">
      <svg solarLockKeyholeMinimalisticLinear [size]="20"></svg>
    </span>
    <p class="algo-level-card__locked-text text-body-medium">
      Complete all 3 sets in <span [style.color]="'var(--color-quiz-' + data.unlocksAfter + ')'">{{ unlocksAfterLabel
        }}</span>
      to unlock <span [style.color]="accentColorVar">{{ label }}</span>
    </p>
  </div>
  } @else {
  <div class="algo-level-card__sets">
    @for (set of data.sets; track set.setNumber) {
    <!-- TODO(content): {{ set.contentRef }} — quiz questions not generated yet for this set -->
    <algo-set-row [setNumber]="set.setNumber" [state]="set.state" [accentColorVar]="accentColorVar"
      (click)="setSelect.emit(set.setNumber)" />
    }
  </div>
  }

  <button type="button" class="algo-level-card__cta" [disabled]="isLocked" (click)="onStart()">
    @if (isLocked) {
    Locked
    <svg solarLockKeyholeMinimalisticLinear [size]="18"></svg>
    } @else {
    Start {{ label }}
    <svg solarArrowRightLinear [size]="18"></svg>
    }
  </button>
</section>
