<div class="algo-pseudocode-section" [class.algo-pseudocode-section--column]="orientation === 'column'">
  <algo-pseudocode-panel
    [lines]="lines"
    [activeLineNumber]="activeLineNumber"
  />

  @if (explanationTitle || explanationDescription) {
    <algo-explanation-panel
      [title]="explanationTitle"
      [description]="explanationDescription"
    />
  }
</div>
