<div class="algo-picker-card">
  <div class="algo-picker-card__icon" aria-hidden="true">
    @if (category === 'graph') {
      <svg viewBox="0 0 200 100" fill="none">
        <line class="algo-picker-card__icon-line" x1="100" y1="15" x2="60" y2="45" />
        <line class="algo-picker-card__icon-line" x1="100" y1="15" x2="140" y2="45" />
        <line class="algo-picker-card__icon-line" x1="60" y1="45" x2="35" y2="80" />
        <line class="algo-picker-card__icon-line" x1="60" y1="45" x2="75" y2="80" />
        <line class="algo-picker-card__icon-line" x1="140" y1="45" x2="125" y2="80" />
        <line class="algo-picker-card__icon-line" x1="140" y1="45" x2="165" y2="80" />
        <circle class="algo-picker-card__icon-node" cx="100" cy="15" r="7" />
        <circle class="algo-picker-card__icon-node" cx="60" cy="45" r="7" />
        <circle class="algo-picker-card__icon-node" cx="140" cy="45" r="7" />
        <circle class="algo-picker-card__icon-node" cx="35" cy="80" r="7" />
        <circle class="algo-picker-card__icon-node" cx="75" cy="80" r="7" />
        <circle class="algo-picker-card__icon-node" cx="125" cy="80" r="7" />
        <circle class="algo-picker-card__icon-node" cx="165" cy="80" r="7" />
      </svg>
    } @else {
      <svg viewBox="0 0 200 100" fill="none">
        <rect class="algo-picker-card__icon-bit" x="10" y="40" width="18" height="60" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="38" y="55" width="18" height="45" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="66" y="20" width="18" height="80" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="94" y="48" width="18" height="52" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="122" y="35" width="18" height="65" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="150" y="60" width="18" height="40" rx="4" />
        <rect class="algo-picker-card__icon-bit" x="178" y="15" width="18" height="85" rx="4" />
      </svg>
    }
  </div>

  <span class="algo-picker-card__name text-title-large">{{ algorithm.nameKey | translate }}</span>
  <p class="algo-picker-card__desc text-body-medium">{{ algorithm.descriptionKey | translate }}</p>

  <algo-button
    variant="outline"
    [fullWidth]="true"
    [hasRightIcon]="true"
    [text]="'landing.picker.cta' | translate"
    (click)="goToAlgorithm()"
  >
    <span right-icon class="algo-picker-card__cta-arrow">→</span>
  </algo-button>
</div>
